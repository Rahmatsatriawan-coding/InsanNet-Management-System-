<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Admin - InsanNet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/app.css" rel="stylesheet">
</head>
<body>
<div class="app">

  <!-- SIDEBAR (nanti dipecah ke templates/sidebar.php) -->
  <nav class="sidebar">
    <div class="brand">InsanNet</div>
    <a href="dashboard.html" class="active">Dashboard</a>
    <a href="#">Pelanggan</a>
    <a href="#">Jadwal Pekerjaan</a>
    <a href="#">Tagihan</a>
    <a href="#">Laporan</a>
    <a href="#">Akun Pengguna</a>
  </nav>

  <!-- KONTEN -->
  <main class="content">
    <h1>Dashboard Admin</h1>

    <div class="row g-3 mb-3">
      <div class="col-12 col-md-4">
        <div class="card-box"><div class="label">Pelanggan aktif</div><div class="value v-green">000</div></div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card-box"><div class="label">Pelanggan isolir</div><div class="value v-yellow">000</div></div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card-box"><div class="label">Pelanggan nonaktif</div><div class="value v-gray">000</div></div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-12 col-lg-8">
        <div class="card-box">
          <strong>Pemasangan dan gangguan per bulan</strong>
          <div class="legend mb-2">
            <i style="background:#2d3a8c"></i>Pemasangan baru &nbsp;
            <i style="background:#f2a93b"></i>Gangguan
          </div>
          <div class="chart">
            <div><div class="grp"><div class="bar pasang" style="height:100px"></div><div class="bar gangguan" style="height:40px"></div></div><div class="bln">Jan</div></div>
            <div><div class="grp"><div class="bar pasang" style="height:130px"></div><div class="bar gangguan" style="height:55px"></div></div><div class="bln">Feb</div></div>
            <div><div class="grp"><div class="bar pasang" style="height:110px"></div><div class="bar gangguan" style="height:70px"></div></div><div class="bln">Mar</div></div>
            <div><div class="grp"><div class="bar pasang" style="height:155px"></div><div class="bar gangguan" style="height:50px"></div></div><div class="bln">Apr</div></div>
            <div><div class="grp"><div class="bar pasang" style="height:140px"></div><div class="bar gangguan" style="height:65px"></div></div><div class="bln">Mei</div></div>
            <div><div class="grp"><div class="bar pasang" style="height:170px"></div><div class="bar gangguan" style="height:55px"></div></div><div class="bln">Jun</div></div>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-4">
        <div class="card-box mb-3"><div class="label">Pendapatan bulan berjalan</div><div class="value">Rp 0</div></div>
        <div class="card-box"><div class="label">Total tunggakan</div><div class="value v-red">Rp 0</div></div>
      </div>
    </div>
  </main>

</div>
</body>
</html>
