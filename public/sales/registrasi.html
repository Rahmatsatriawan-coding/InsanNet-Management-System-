<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrasi Pelanggan - InsanNet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/sales.css" rel="stylesheet">
</head>
<body>
  <div class="card-sales">
    <div class="head">Sales: Registrasi Pelanggan</div>
    <div class="body">
      <form method="POST" action="#" enctype="multipart/form-data">

        <label for="nama" class="lbl">Nama pelanggan</label>
        <input type="text" id="nama" name="nama" class="form-control" required>

        <label for="wa" class="lbl">Nomor WhatsApp</label>
        <input type="tel" id="wa" name="whatsapp" class="form-control" required>

        <label class="upload-box">
          Unggah foto depan rumah
          <input type="file" name="foto_rumah" accept="image/*" hidden>
        </label>

        <div class="upload-box">Titik lokasi rumah (peta)</div>

        <button type="button" class="btn-odp">Cek ODP terdekat</button>
        <button type="submit" class="btn-kirim">Kirim pengajuan</button>

        <span class="lbl">Status pengajuan</span>
        <div class="steps">
          <span class="active">Pengajuan</span>
          <span>Disetujui</span>
          <span>Penjadwalan</span>
          <span>Aktif</span>
        </div>

      </form>
    </div>
  </div>
</body>
</html>
